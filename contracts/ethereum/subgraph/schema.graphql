# Pet entities for PvP matchmaking. Field names mirror `pet_roster` and the
# GraphQL selection set in indexer-go's EVM adapter
# (services/indexer-go/internal/evm/client.go) — they MUST stay identical or the indexer
# silently reads zero values.

type Pet @entity(immutable: false) {
  "Token id as a string (matches pet_roster.pet_id)."
  id: ID!

  "Current owner address (indexer-go lowercases on ingest)."
  owner: Bytes!

  name: String!

  "On-chain DNA (uint256, 16 decimal digits)."
  dna: BigInt!

  level: Int!
  rarity: Int!

  """
  Unix seconds the pet is next battle-ready (Pet.readyTime). Only breeding writes it
  now — a newborn is barred from fighting until its cooldown expires — but the backend
  still honours it before accepting a battle intent.
  """
  readyAt: BigInt!

  "Block timestamp of the last update (the per-pet version indexer-go resumes from)."
  updatedAt: BigInt!

  # ─── v2 fields (plan §3.4, §4.1, §3.7, §4.4) ───────────────────────────────
  "XP toward the next level; auto-levels at 100 * level."
  xp: Int!
  "0 = minted (gen-0); else max(parents)+1."
  generation: Int!
  "Breeding lineage; 0 = none."
  parent1Id: BigInt!
  parent2Id: BigInt!
  "Times used as a breeding parent (cooldown curve)."
  breedCount: Int!
  "Resolved at mint from DNA + rarity tier; 0 until species pools land."
  speciesId: Int!
  "Marriage spouse pet id (PetCore.marriageOf); 0 = unmarried."
  spouseId: BigInt!
  "Unix seconds the pet is next breed-ready."
  breedReadyAt: BigInt!
  "Unix seconds the pet is next train-ready."
  trainReadyAt: BigInt!
}

# Internal join record for breeding: BreedSettled carries only the childId, so
# we persist the request's two parents to refresh their breedCount/cooldown at
# settle time. Not queried by indexer-go.
type BreedRequest @entity(immutable: false) {
  "requestId as a string."
  id: ID!
  petId1: BigInt!
  petId2: BigInt!
}

# ─── Inventory (roadmap §4) ───────────────────────────────────────────────────
# Same contract as Pet above: field names mirror what indexer-go selects, and both
# entities carry `updatedAt` because that block timestamp is the per-row version the
# indexer resumes from and the version guard compares.
#
# Neither entity is ever removed. A wallet that spends its last potion, or a slot that is
# emptied, has to produce a row the indexer can *see*, and a deleted entity is invisible to
# a watermark query: the indexer would keep serving the stale balance forever. So zero is
# written as a value rather than as an absence.

type ItemBalance @entity(immutable: false) {
  "`{owner}-{itemType}`, lowercase owner."
  id: ID!

  "Holder address. The ItemCore contract itself appears here holding escrowed equipment."
  owner: Bytes!

  "ERC-1155 token id, which is the item *type*, not one instance of it."
  itemType: BigInt!

  "How many the holder has. Re-read from balanceOf rather than accumulated from deltas."
  quantity: BigInt!

  "Block timestamp of the last update."
  updatedAt: BigInt!
}

type PetEquipment @entity(immutable: false) {
  "`{petId}-{slot}`."
  id: ID!

  petId: BigInt!

  "0 = weapon, 1 = armor, 2 = trinket (ItemCore.SLOT_*)."
  slot: Int!

  "Equipped item type, or 0 for an empty slot."
  itemType: BigInt!

  "Block timestamp of the last update."
  updatedAt: BigInt!
}
