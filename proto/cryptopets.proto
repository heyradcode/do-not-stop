// Shared contract between indexer-go (server) and the Node backend (client).
// Node loads this file at runtime via @grpc/proto-loader; Go stubs are
// generated into indexer-go/pb with `buf generate` (see indexer-go/buf.gen.yaml).
syntax = "proto3";

package cryptopets;

option go_package = "github.com/radcrew/do-not-stop/indexer-go/pb";

service GameDataService {
  // Server streaming: indexer-go pushes settled battles (both chains) the
  // moment they index. Delivery is at-least-once — consumers must be
  // idempotent by (chain, battle_id).
  rpc StreamLiveBattles(StreamRequest) returns (stream BattleEvent);

  // RAM reads from the write-through roster cache (coherent because
  // indexer-go is the sole writer of pet_roster after promotion). Both
  // return UNAVAILABLE until warm-up completes — callers fall back to
  // their own database read.
  rpc GetPetState(PetRequest) returns (PetResponse);
  // Mirrors the backend's findReadyOpponents matchmaking query:
  // battle-ready (ready_at <= now), not owned by the caller, optional
  // minimum level, ordered by (level, pet_id), paged.
  rpc ListReadyOpponents(OpponentsRequest) returns (OpponentsResponse);

  // Pre-fight win estimate (plan §3.3): runs the round-based combat sim over
  // many seeds for pet_id1 vs pet_id2 (both read from the warm roster cache)
  // and returns pet_id1's win probability. UNAVAILABLE until the cache is warm.
  rpc EstimateWin(WinRequest) returns (WinResponse);

  // Independent recomputation of a backend-authoritative battle
  // (docs/plan-backend-battle-architecture.md §F). Takes everything needed to
  // rerun the fight and the progression composition — no database, no cache,
  // no chain state — so a mismatch against the TypeScript engine's own result
  // means the two implementations disagree, not that either read something
  // different. Release safety only: this does not constrain an operator who
  // controls both processes (see the architecture doc's "what the Go verifier
  // is for" section). Never wired to any state-mutating path.
  rpc VerifyBattle(VerifyBattleRequest) returns (VerifyBattleResponse);
}

message PetRequest {
  string chain = 1;
  string pet_id = 2;
}

message PetResponse {
  string chain = 1;
  string pet_id = 2;
  string owner = 3;
  string name = 4;
  uint32 level = 5;
  uint32 rarity = 6;
  string dna = 7; // bigint as string, matching pet_roster.dna
  uint32 win_count = 8;
  uint32 loss_count = 9;
  int64 ready_at = 10; // unix seconds the pet is next BATTLE-ready
  uint64 version = 11;

  // v2 fields (plan §3.4, §4.1, §3.7, §4.4, §2.3). Append-only field numbers so
  // a backend on the old proto keeps working.
  uint32 xp = 12;
  uint32 generation = 13;
  string parent1_id = 14; // "0" = none
  string parent2_id = 15;
  uint32 breed_count = 16;
  uint32 species_id = 17;
  string spouse_id = 18; // "0" = unmarried
  int64 breed_ready_at = 19; // unix seconds next breed-ready
  int64 train_ready_at = 20; // unix seconds next train-ready
  string asset = 21; // Metaplex Core asset pubkey (Solana only); "" on EVM
}

message OpponentsRequest {
  string chain = 1;
  string exclude_owner = 2; // normalized address / pubkey
  uint32 min_level = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

message OpponentsResponse {
  repeated PetResponse pets = 1;
  uint32 total = 2; // total matches before paging (pagination parity)
}

message WinRequest {
  string chain = 1;
  string pet_id1 = 2; // the pet whose win probability is returned
  string pet_id2 = 3; // the opponent
  uint32 samples = 4; // seeds to sample; 0 = server default
}

message WinResponse {
  double win_probability = 1; // pet_id1's win probability in [0,1]
  uint32 samples = 2; // seeds actually sampled
}

// One pet's frozen snapshot fields, as needed to recompute a fight and its
// progression. Mirrors indexer-go's combat.PetInputs / protocol's PetSnapshot
// (the subset both computations actually read — owner, readyAt, and
// sourceVersion are not needed to run the fight).
message VerifyPetInputs {
  string pet_id = 1; // decimal string; parsed to uint64 server-side
  string dna = 2; // decimal string (16-digit DNA fits uint64)
  uint32 rarity = 3;
  uint32 level = 4;
  uint32 skill = 5;
  uint32 xp = 6;
  string last_opponent_id = 7; // decimal string; "0" = no prior opponent
  uint32 streak = 8;
}

// Mirrors protocol's SkillConfig field for field.
message VerifySkillConfig {
  uint32 tank_hp_mult = 1;
  uint32 shell_def_mult = 2;
  uint32 swift_crit_bonus = 3;
  uint32 cunning_crit_cap = 4;
  uint32 fury_dmg_mult = 5;
  uint32 fury_hp_threshold = 6;
  uint32 sage_mdef_mult = 7;
  uint32 bloodlust_bps = 8;
}

message VerifyBattleRequest {
  VerifyPetInputs attacker = 1;
  VerifyPetInputs defender = 2;
  bytes seed = 3; // 32 bytes, big-endian, matching the on-chain uint256 seed
  VerifySkillConfig skill_config = 4;
  uint32 max_level = 5;
}

// One resolved attack, in fight order. Mirrors indexer-go's
// combat.StrikeLogEntry / protocol's StrikeLogEntry field for field, so the
// caller can convert this into the same shape the TypeScript engine produces
// and hash both with @cryptopets/protocol's canonical encoding — Go never
// reimplements that encoding itself (see indexer-go's simlog.go doc comment).
message VerifyStrikeLogEntry {
  uint32 round = 1;
  uint32 attacker = 2; // 1 = pet1/attacker, 2 = pet2/defender
  bool is_magic = 3;
  bool crit = 4;
  uint64 damage = 5;
  uint64 heal = 6;
  uint32 element_mult = 7; // 85 | 100 | 115
  bool fury_triggered = 8;
  bool rebirth_triggered = 9;
  uint32 hp1_after = 10;
  uint32 hp2_after = 11;
}

// Mirrors indexer-go's combat.PetProgression / protocol's PetProgression.
message VerifyPetProgression {
  string pet_id = 1;
  bool won = 2;
  uint32 decay_shift = 3;
  uint32 xp_awarded = 4;
  string last_opponent_id = 5;
  uint32 streak = 6;
  uint32 level = 7;
  uint32 xp = 8;
  bool leveled_up = 9;
}

message VerifyBattleResponse {
  bool first_wins = 1;
  uint32 rounds = 2;
  uint32 winner_hp_remaining = 3;
  uint32 start_hp1 = 4;
  uint32 start_hp2 = 5;
  repeated VerifyStrikeLogEntry log = 6;
  VerifyPetProgression attacker = 7;
  VerifyPetProgression defender = 8;
}

message StreamRequest {
  // Resume point per chain so a reconnecting client misses nothing:
  // chain -> last seen version (Solana slot / EVM block timestamp).
  // Missing chains replay nothing and stream live-only.
  map<string, uint64> after_version = 1;
}

message BattleEvent {
  string chain = 1; // "evm" | "solana"
  string battle_id = 2; // settle sig (solana) / txHash-logIndex (evm)
  string attacker_pet = 3;
  string defender_pet = 4;
  string winner_pet = 5; // absolute pet id — matches battle_history.winner_pet_id
  uint64 version = 6; // feed back as after_version on reconnect
  int64 fought_at = 7; // unix seconds

  // v2 round-based combat sim outputs (plan §3.3). Append-only field numbers.
  string loser_pet = 8; // absolute pet id of the loser
  string seed = 9; // 0x-hex 32-byte combat seed; replays the sim off-chain
  uint32 rounds = 10;
  uint32 winner_hp_remaining = 11;
  uint32 xp_win = 12;
  uint32 xp_loss = 13;
}
