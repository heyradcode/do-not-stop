# Pet entities for PvP matchmaking. Field names mirror `pet_roster` and the
# GraphQL selection set in indexer-go's EVM adapter
# (services/indexer-go/internal/evm/client.go) — they MUST stay identical or the indexer
# silently reads zero values.

type Pet @entity(immutable: false) {
  "Token id as a string (matches pet_roster.pet_id)."
  id: ID!

  "Current owner address (indexer-go lowercases on ingest)."
  owner: Bytes!

  name: String!

  "On-chain DNA (uint256, 16 decimal digits)."
  dna: BigInt!

  level: Int!
  rarity: Int!

  """
  Unix seconds the pet is next battle-ready (Pet.readyTime). Only breeding writes it
  now — a newborn is barred from fighting until its cooldown expires — but the backend
  still honours it before accepting a battle intent.
  """
  readyAt: BigInt!

  "Block timestamp of the last update (the per-pet version indexer-go resumes from)."
  updatedAt: BigInt!

  # ─── v2 fields (plan §3.4, §4.1, §3.7, §4.4) ───────────────────────────────
  "XP toward the next level; auto-levels at 100 * level."
  xp: Int!
  "0 = minted (gen-0); else max(parents)+1."
  generation: Int!
  "Breeding lineage; 0 = none."
  parent1Id: BigInt!
  parent2Id: BigInt!
  "Times used as a breeding parent (cooldown curve)."
  breedCount: Int!
  "Resolved at mint from DNA + rarity tier; 0 until species pools land."
  speciesId: Int!
  "Marriage spouse pet id (PetCore.marriageOf); 0 = unmarried."
  spouseId: BigInt!
  "Unix seconds the pet is next breed-ready."
  breedReadyAt: BigInt!
  "Unix seconds the pet is next train-ready."
  trainReadyAt: BigInt!
}

# Internal join record for breeding: BreedSettled carries only the childId, so
# we persist the request's two parents to refresh their breedCount/cooldown at
# settle time. Not queried by indexer-go.
type BreedRequest @entity(immutable: false) {
  "requestId as a string."
  id: ID!
  petId1: BigInt!
  petId2: BigInt!
}
