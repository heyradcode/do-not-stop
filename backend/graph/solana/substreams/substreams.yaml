specVersion: v0.1.0
package:
  name: cryptopets_solana
  version: v0.1.0
  description: Indexes CryptoPets PetAccount state from the Solana program.

# Default network; run.sh derives the active one from SOLANA_NETWORK (sink/.env)
# and passes `--network` to pack/run.
network: solana-devnet

# Per-network initialBlock overrides, selected by the active `network`. Devnet's
# hosted AccountBlock Firehose only streams from block 455457500 onward — an
# earlier start is rejected with "must be >= 455457500".
networks:
  solana-mainnet:
    initialBlock:
      map_pets: 0
      db_out: 0
  solana-devnet:
    initialBlock:
      map_pets: 455457500
      db_out: 455457500

imports:
  # Foundational module that streams the program-owned accounts we filter on.
  accounts: https://spkg.io/streamingfast/solana-accounts-foundational-v0.0.2.spkg
  # Provides the sf.substreams.sink.sql.v1.Service type for the sink block below.
  sql: https://github.com/streamingfast/substreams-sink-sql/releases/download/protodefs-v1.0.7/substreams-sink-sql-protodefs-v1.0.7.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/cryptopets_solana.wasm

modules:
  # Decode every owned PetAccount into our domain Pet message.
  - name: map_pets
    kind: map
    initialBlock: 0
    inputs:
      - map: accounts:filtered_accounts
    output:
      type: proto:cryptopets.v1.Pets

  # Translate Pets into database changes for substreams-sink-sql.
  - name: db_out
    kind: map
    initialBlock: 0
    inputs:
      - map: map_pets
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

# Filter upstream accounts to those owned by the cryptopets program.
# Keep this in sync with `declare_id!` in the Anchor program.
params:
  accounts:filtered_accounts: owner:78AXV46ks5oFoJHkukvbsfZTJixdj2MeStzuC6thiUry

# substreams-sink-sql config (embedded in the spkg). `setup` reads schema.sql
# and creates the tables + a cursors table; `run` streams db_out into them.
sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "../sink/schema.sql"
    engine: postgres

protobuf:
  files:
    - cryptopets.proto
    # Vendored from substreams-database-change (kept out of ./proto so buf
    # doesn't regenerate it — we use the crate's Rust types).
    - sf/substreams/sink/database/v1/database.proto
  importPaths:
    - ./proto
    - ./proto-imports
