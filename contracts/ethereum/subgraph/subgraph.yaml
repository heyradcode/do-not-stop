specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CryptoPets
    network: sepolia
    source:
      address: "0xd68c951132fda610062a03252d303f80cdb2379f"
      abi: CryptoPets
      startBlock: 10913782
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pet
      abis:
        - name: CryptoPets
          file: ./abis/CryptoPets.json
        - name: Battle
          file: ./abis/Battle.json
        - name: Inventory
          file: ./abis/Inventory.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: BreedFulfilled(indexed address,indexed uint256,indexed uint256)
          handler: handleBreedFulfilled
      file: ./src/crypto-pets.ts

  - kind: ethereum
    name: Battle
    network: sepolia
    source:
      address: "0x80285786f8850aa3e57b07d037c741635eb84f9f"
      abi: Battle
      startBlock: 10913782
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pet
        - Battle
      abis:
        - name: CryptoPets
          file: ./abis/CryptoPets.json
        - name: Battle
          file: ./abis/Battle.json
      eventHandlers:
        - event: FightResult(uint256,uint256,bool)
          handler: handleFightResult
      file: ./src/battle.ts

  - kind: ethereum
    name: Inventory
    network: sepolia
    source:
      address: "0xa0855fa0c495f2991af824c80f499e2c1ce0a5de"
      abi: Inventory
      startBlock: 10913782
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pet
      abis:
        - name: CryptoPets
          file: ./abis/CryptoPets.json
        - name: Inventory
          file: ./abis/Inventory.json
      eventHandlers:
        - event: NewPet(uint256,string,uint256,uint8)
          handler: handleNewPet
        - event: PetLevelUp(uint256,uint32)
          handler: handlePetLevelUp
        - event: PetNameChanged(uint256,string)
          handler: handlePetNameChanged
        - event: PetDnaChanged(uint256,uint256)
          handler: handlePetDnaChanged
      file: ./src/inventory.ts
