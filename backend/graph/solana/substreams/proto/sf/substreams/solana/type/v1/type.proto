syntax = "proto3";

package sf.substreams.solana.type.v1;

import "sf/solana/type/v1/type.proto";

// Output of the imported `accounts:filtered_accounts` module — the input to
// our `map_pets` handler. Vendored subset of `solana-accounts-foundational`.
message FilteredAccounts {
  repeated sf.solana.type.v1.Account accounts = 1;
}
