specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: substreams
    name: CryptoPetsSolana
    network: {{NETWORK}}
    source:
      package:
        moduleName: map_pets
        file: ../substreams/substreams.spkg
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pet
      file: ./src/mappings.ts
      handler: handlePets
