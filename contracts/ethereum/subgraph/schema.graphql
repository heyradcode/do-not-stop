# Pet entities for PvP matchmaking. Field names mirror `pet_roster` and the
# GraphQL selection set in indexer-go's EVM adapter
# (indexer-go/internal/evm/client.go) — they MUST stay identical or the indexer
# silently reads zero values.

type Pet @entity(immutable: false) {
  "Token id as a string (matches pet_roster.pet_id)."
  id: ID!

  "Current owner address (indexer-go lowercases on ingest)."
  owner: Bytes!

  name: String!

  "On-chain DNA (uint256, 16 decimal digits)."
  dna: BigInt!

  level: Int!
  rarity: Int!
  winCount: Int!
  lossCount: Int!

  "Unix seconds the pet is next BATTLE-ready (Pet.readyTime)."
  readyAt: BigInt!

  "Block timestamp of the last update (the per-pet version indexer-go resumes from)."
  updatedAt: BigInt!

  # ─── v2 fields (plan §3.4, §4.1, §3.7, §4.4) ───────────────────────────────
  "XP toward the next level; auto-levels at 100 * level."
  xp: Int!
  "0 = minted (gen-0); else max(parents)+1."
  generation: Int!
  "Breeding lineage; 0 = none."
  parent1Id: BigInt!
  parent2Id: BigInt!
  "Times used as a breeding parent (cooldown curve)."
  breedCount: Int!
  "Resolved at mint from DNA + rarity tier; 0 until species pools land."
  speciesId: Int!
  "Marriage spouse pet id (PetCore.marriageOf); 0 = unmarried."
  spouseId: BigInt!
  "Unix seconds the pet is next breed-ready."
  breedReadyAt: BigInt!
  "Unix seconds the pet is next train-ready."
  trainReadyAt: BigInt!
}

# One row per settled battle. On EVM the attacker/defender come from
# BattleRandomnessRequested and the result from BattleResolved; the two are
# joined by requestId (see BattleRequest below). Consumed by indexer-go's
# battle polling into battle_history and the StreamLiveBattles gRPC feed.
type Battle @entity(immutable: true) {
  "txHash-logIndex of the BattleResolved log — matches battle_history.battle_id."
  id: ID!

  "Attacker pet id as a string (BattleRandomnessRequested.petId1), matching Pet.id."
  attacker: String!
  "Defender pet id as a string (BattleRandomnessRequested.petId2)."
  defender: String!

  "Absolute winner pet id — head-to-head stays correct across role swaps."
  winnerPetId: String!
  "Absolute loser pet id."
  loserPetId: String!

  # ─── v2 round-based combat sim outputs (plan §3.3) ─────────────────────────
  "uint256 VRF seed; indexer-go normalizes it to 0x-hex for cross-chain replay."
  seed: BigInt!
  rounds: Int!
  winnerHpRemaining: Int!
  xpWin: Int!
  xpLoss: Int!

  "Block timestamp of the settle (unix seconds) — the per-chain version cursor."
  foughtAt: BigInt!
}

# Internal join record: BattleRandomnessRequested carries attacker/defender
# keyed by requestId, but BattleResolved (which carries the outcome) only
# carries winner/loser. We persist the request so the resolve handler can
# recover attacker/defender. Not queried by indexer-go.
type BattleRequest @entity(immutable: false) {
  "requestId as a string."
  id: ID!
  petId1: BigInt!
  petId2: BigInt!
}

# Internal join record for breeding: BreedSettled carries only the childId, so
# we persist the request's two parents to refresh their breedCount/cooldown at
# settle time. Not queried by indexer-go.
type BreedRequest @entity(immutable: false) {
  "requestId as a string."
  id: ID!
  petId1: BigInt!
  petId2: BigInt!
}
