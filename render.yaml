# Render Blueprint — https://render.com/docs/blueprint-spec
#
# IMPORTANT: Leave "Root Directory" empty in the Render dashboard (monorepo root).
# Do NOT set Root Directory to `services/backend` — the pnpm lockfile lives at the repo root.
#
# After deploy, set VITE_API_URL on the frontend to your Render service URL.

services:
  - type: web
    name: do-not-stop-api
    runtime: node
    plan: free
    # Do not set NODE_ENV=production here — it skips devDependencies (typescript) at install time.
    #
    # Render's base image ships pnpm as a corepack shim in the read-only /usr/bin. Invoking that
    # shim while package.json has a "packageManager" field makes corepack try to rewrite the shim
    # in place → "EROFS: read-only file system, unlink '/usr/bin/pnpm'". So we install a standalone
    # pnpm into a writable prefix and put it first on PATH, never touching the corepack shim.
    buildCommand: |
      export PNPM_PREFIX="$HOME/.npm-global"
      export PATH="$PNPM_PREFIX/bin:$PATH"
      npm install -g --prefix "$PNPM_PREFIX" pnpm@9.15.9
      HUSKY=0 pnpm install --frozen-lockfile --prod=false --filter backend... && pnpm --filter backend build
    # Start node directly so runtime never invokes the corepack pnpm shim.
    # @shared/core/node is bundled to services/backend/dist/shared-node.cjs at build time.
    startCommand: NODE_ENV=production node services/backend/dist/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: HUSKY
        value: "0"
      - key: JWT_SECRET
        generateValue: true
      # Proto is copied to services/backend/dist/proto at build; this override is a belt-and-suspenders
      # path from the monorepo-root cwd used by startCommand.
      - key: INDEXER_PROTO_PATH
        value: proto/cryptopets.proto
      # Leave unset / empty until private networking reaches do-not-stop-indexer.
      # A leftover localhost:50051 from a local .env will crash or spam reconnects.
      - key: INDEXER_GRPC_ADDR
        value: ""

  # indexer-go: unified cross-chain indexer (see services/indexer-go/README.md).
  # Deployed as a web service (not a worker) so it stays on the free plan —
  # /healthz answers Render's checks and /metrics rides the same port via the
  # PORT env convention. Trade-off: free web services sleep when idle; the
  # reconnect/backfill machinery is designed to recover the gap on wake.
  #
  # This is the ONLY writer of pet_roster — the backend has no indexer — so an
  # idle-sleeping instance means a stale roster, not a redundant one.
  #
  # gRPC (pet-state reads / win estimates) between the two services needs
  # private networking; if unavailable on this plan, leave INDEXER_GRPC_ADDR
  # unset on the API service — the backend reads the database directly and
  # matchmaking always does. Do not copy localhost:50051 from a local .env.
  # Set indexer connection env vars in the dashboard:
  #   DATABASE_URL, EVM_SUBGRAPH_URL, SOLANA_WS_URL, SOLANA_RPC_URL,
  #   SOLANA_PROGRAM_ID — and at promotion: ROSTER_CACHE_ENABLED=true.
  # Do NOT set HEALTH_ADDR on Render (leave unset so PORT → 0.0.0.0:$PORT).
  - type: web
    name: do-not-stop-indexer
    runtime: go
    plan: free
    rootDir: services/indexer-go
    buildCommand: go build -o bin/indexer ./cmd/indexer
    startCommand: ./bin/indexer
    healthCheckPath: /healthz
    envVars:
      - key: LOG_FORMAT
        value: json

  # image-generator: pet NFT art (see services/image-generator/README.md).
  #
  # rootDir is the whole story here: this package is NOT a pnpm workspace member
  # and keeps its own lockfile, so --ignore-workspace stops the install walking
  # up to the monorepo root and installing that instead, which would leave this
  # service with no node_modules.
  #
  # Art is optional by construction: leave VITE_IMAGE_SERVICE_URL unset on the
  # frontend, or let this service sleep, and pets fall back to emoji avatars.
  # Nothing else degrades.
  - type: web
    name: do-not-stop-image-generator
    runtime: node
    plan: free
    rootDir: services/image-generator
    # Do not set NODE_ENV=production here — it skips the TypeScript
    # devDependency the build needs. Same corepack workaround as the API service
    # above: install a standalone pnpm rather than touching the read-only shim.
    buildCommand: |
      export PNPM_PREFIX="$HOME/.npm-global"
      export PATH="$PNPM_PREFIX/bin:$PATH"
      npm install -g --prefix "$PNPM_PREFIX" pnpm@9.15.9
      pnpm install --ignore-workspace --frozen-lockfile && pnpm build
    startCommand: node dist/main.js
    # /health, not /ready: /ready calls out to R2 and every chain RPC, so wiring
    # the platform probe to it lets an upstream blip cycle a healthy service.
    # Check /ready yourself once after deploying instead.
    healthCheckPath: /health
    envVars:
      # Must match this service's own URL, or metadata hands marketplaces
      # image links that 404.
      - key: PUBLIC_BASE_URL
        sync: false
      # r2, not filesystem: free web services sleep when idle, and a service
      # that slept on local disk wakes up and regenerates art every pet owner
      # has already seen. Generated art must survive the instance.
      - key: IMAGE_STORE
        value: r2
      # Set in the dashboard, not here: CF_ACCOUNT_ID, CF_API_TOKEN, R2_BUCKET,
      # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, EVM_RPC_URL, PETCORE_ADDRESS,
      # and SOLANA_RPC_URL + SOLANA_PROGRAM_ID together if serving Solana pets.
      # Note the Solana lookup uses getProgramAccounts, which some hosted
      # providers disable.
