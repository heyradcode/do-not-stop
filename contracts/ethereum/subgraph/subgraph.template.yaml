# Template — `scripts/prepare-subgraph.mjs` fills {{...}} and writes subgraph.yaml.
# Three v2 data sources: the PetCore proxy (pet lifecycle + marriage), the
# GameLogic proxy (breed/mint/train), and the ItemCore proxy (inventory, roadmap
# §4). The first two share src/mapping.ts and both carry the PetCore ABI so
# handlers can read full pet state via getPet(); ItemCore has its own
# src/item.ts, since it touches neither Pet nor the pet ABI.
specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: PetCore
    network: {{NETWORK}}
    source:
      address: "{{PETCORE_ADDRESS}}"
      abi: PetCore
      startBlock: {{START_BLOCK}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pet
      abis:
        - name: PetCore
          file: ./abis/PetCore.json
      eventHandlers:
        - event: NewPet(indexed uint256,string,uint256,uint8)
          handler: handleNewPet
        - event: PetLevelUp(indexed uint256,uint32)
          handler: handlePetLevelUp
        - event: PetNameChanged(indexed uint256,string)
          handler: handlePetNameChanged
        - event: PetTransferred(indexed uint256,address,address)
          handler: handlePetTransferred
        - event: MarriageAccepted(indexed uint256,indexed uint256)
          handler: handleMarriageAccepted
        - event: MarriageDissolved(indexed uint256,indexed uint256,string)
          handler: handleMarriageDissolved
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: GameLogic
    network: {{NETWORK}}
    source:
      address: "{{GAMELOGIC_ADDRESS}}"
      abi: GameLogic
      startBlock: {{START_BLOCK}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pet
        - BreedRequest
      abis:
        - name: GameLogic
          file: ./abis/GameLogic.json
        - name: PetCore
          file: ./abis/PetCore.json
      eventHandlers:
        - event: BreedRandomnessRequested(indexed address,indexed uint256,uint256,uint256)
          handler: handleBreedRequested
        - event: BreedSettled(indexed address,indexed uint256,indexed uint256,address)
          handler: handleBreedSettled
        - event: Trained(indexed uint256,uint32,uint32,uint32)
          handler: handleTrained
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: ItemCore
    network: {{NETWORK}}
    source:
      address: "{{ITEMCORE_ADDRESS}}"
      abi: ItemCore
      startBlock: {{START_BLOCK}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ItemBalance
        - PetEquipment
      abis:
        - name: ItemCore
          file: ./abis/ItemCore.json
      eventHandlers:
        # Balances come off the ERC-1155 transfers rather than ItemsMinted/ItemsBurned:
        # minting, burning, escrowing gear, returning it and a plain wallet-to-wallet send
        # all emit a transfer, and only some of them emit anything else.
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
        - event: ItemEquipped(indexed uint256,indexed uint8,indexed uint256,address)
          handler: handleItemEquipped
        - event: ItemUnequipped(indexed uint256,indexed uint8,indexed uint256,address)
          handler: handleItemUnequipped
      file: ./src/item.ts
