[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
cryptopets = "78AXV46ks5oFoJHkukvbsfZTJixdj2MeStzuC6thiUry"

[programs.devnet]
cryptopets = "78AXV46ks5oFoJHkukvbsfZTJixdj2MeStzuC6thiUry"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Cloned from devnet so `anchor test`'s local validator has the Metaplex Core
# program available for the CPIs in `initialize`/`settle_mint`/`settle_breed`/
# `sync_metadata` (plan §2.3/v2.1 Phase A). The Switchboard On-Demand program is
# also cloned for the commit/reveal randomness flow (`commit_mint`/`settle_mint`,
# `commit_breed`/`settle_breed`, `commit_battle`/`settle_battle`).
#
# Verified against devnet (2026-06-12): both programs exist and are executable
# under the BPF upgradeable loader. The Switchboard address was corrected from a
# one-char typo (...Ze1oMUu -> ...Ze1oMUv); ...oMUv is the ON_DEMAND_MAINNET_PID
# declared by the switchboard-on-demand crate, which is what the program expects
# when built without the `devnet` feature.
[test.validator]
url = "https://api.devnet.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d" # mpl-core program

[[test.validator.clone]]
address = "SBondMDrcV3K4kxZR1HNVT7osZxAHVHgYXL5Ze1oMUv" # Switchboard On-Demand program
