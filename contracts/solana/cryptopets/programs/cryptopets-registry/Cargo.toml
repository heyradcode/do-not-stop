[package]
name = "cryptopets-registry"
version = "0.1.0"
description = "Immutable publication record for batches of backend-resolved battle receipts"
edition = "2021"
license-file = "../../../../LICENSE"

[lib]
crate-type = ["cdylib", "lib"]
name = "cryptopets_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

# Deliberately anchor-lang and nothing else. This program stores roots: it does not
# hash, mint, hold funds, or CPI anywhere. Every dependency added here is code that
# ends up inside the one contract whose whole value is being small enough to audit,
# and which cannot be patched once its upgrade authority is burned.
[dependencies]
anchor-lang = "0.32.1"
