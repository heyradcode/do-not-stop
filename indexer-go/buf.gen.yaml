# Generate Go stubs from ../proto into ./pb:
#   buf generate ../proto --template buf.gen.yaml
# Requires protoc-gen-go and protoc-gen-go-grpc on PATH (go install).
version: v2
plugins:
  - local: protoc-gen-go
    out: pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pb
    opt: paths=source_relative
