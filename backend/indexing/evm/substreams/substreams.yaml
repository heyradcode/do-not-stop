specVersion: v0.1.0
package:
  name: cryptopets_evm
  version: v0.1.0

imports:
  ethcommon: https://spkg.io/streamingfast/ethereum-common-v0.1.0.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/cryptopets_evm.wasm

modules:
  - name: map_pets
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:cryptopets.v1.Pets

networks:
  sepolia:
    initialBlocks:
      default: 0

protobuf:
  files:
    - cryptopets.proto
  importPaths:
    - ./proto
