name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Allow the report action to create / update the coverage comment on the PR.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            filter: backend
            directory: backend
          - package: frontend
            filter: frontend
            directory: frontend
          - package: shared
            filter: '@shared/core'
            directory: shared
    name: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter ${{ matrix.filter }} test:coverage

      # Posts (and updates) a sticky coverage comment on the PR conversation,
      # plus a job summary. Runs even if tests fail so the report still lands.
      - name: Report coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.package }}
          working-directory: ${{ matrix.directory }}
